repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Lint
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff Format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]

      - id: detect-secrets
        name: Detect Secrets
        entry: uv run --no-sync detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]